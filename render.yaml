services:
  - type: web
    name: dyslexia-classifier-api
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: "https://frontend-five-flame-71.vercel.app,http://localhost:3000"
